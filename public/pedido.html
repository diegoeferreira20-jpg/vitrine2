<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Seu pedido · NCR iPhone</title><meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"></head>
<body>
<header><img class="logo" src="/logo.png" alt="NCR iPhone"><h1 id="t">Seu pedido</h1><p class="sub" id="s">Verificando o pagamento...</p></header>
<main class="adm" id="m"></main>
<script>
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k==='class'?e.className=a[k]:e.setAttribute(k,a[k]);c.flat().forEach(x=>x!=null&&e.append(x.nodeType?x:document.createTextNode(x)));return e};
const WA='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MT={pix:'Pix',bank_transfer:'Pix',credit_card:'Cartão de crédito',debit_card:'Cartão de débito',ticket:'Boleto',account_money:'Saldo Mercado Pago'};
const q=new URLSearchParams(location.search),ref=q.get('ref'),back=q.get('r');
const pid=q.get('payment_id')||q.get('collection_id')||'';
const $=id=>document.getElementById(id);

function clearCart(){
  try{Object.keys(localStorage).filter(k=>k.startsWith('cart:')&&k!=='cart:name'&&k!=='cart:phone').forEach(k=>localStorage.removeItem(k))}catch{}
}
function show(o){
  const paid=o.status==='paid',pending=(o.status==='pending'||o.status==='check')&&back!=='fail';
  const code='#'+o.ref.slice(0,6).toUpperCase(),home=o.slug?'/v/'+o.slug:'/';
  const nome=o.customer?o.customer.split(' ')[0]:'';
  $('t').textContent=paid?'Pagamento confirmado ✓':pending?'Aguardando confirmação':o.status==='refunded'?'Pagamento estornado':'Pagamento não concluído';
  $('s').textContent=paid?`Obrigado${nome?', '+nome:''}! Pedido ${code}`
    :pending?`Pedido ${code}. Assim que o pagamento for confirmado, a loja é avisada.`
    :o.status==='refunded'?'O valor deste pedido foi devolvido.':'Nenhum valor foi cobrado. Você pode voltar e tentar de novo.';
  if(paid||pending)clearCart();
  const box=h('div',{class:'box'},
    h('h3',{},'Resumo do pedido'),
    h('ul',{class:'ordl'},o.items.map(i=>h('li',{},`${i.qty}x ${i.name} - ${brl(i.unit*i.qty)}`))),
    h('div',{class:'ordt'},h('span',{},'Total'),h('b',{},brl(o.total))),
    o.method?h('p',{class:'note'},'Forma de pagamento: '+(MT[o.method]||o.method)):null);
  if((paid||pending)&&o.whatsapp){
    const msg=`Olá! Fiz o pedido ${code} pelo site (${paid?'pagamento confirmado':'pagamento em andamento'}${o.method?', '+(MT[o.method]||o.method):''}).\n\n${o.items.map(i=>`• ${i.qty}x ${i.name}`).join('\n')}\n\nTotal: ${brl(o.total)}${o.customer?`\n\nNome: ${o.customer}`:''}`;
    const a=h('a',{class:'btn wa',target:'_blank',rel:'noopener',href:`https://wa.me/${o.whatsapp}?text=${encodeURIComponent(msg)}`},'Avisar a loja pelo WhatsApp');
    a.insertAdjacentHTML('afterbegin',WA);box.append(a);
  }
  box.append(h('a',{class:'btn ghost',href:home},paid||pending?'Voltar à vitrine':'Voltar e tentar de novo'));
  $('m').replaceChildren(box);
}
function fail(msg){$('t').textContent='Pedido não encontrado';$('s').textContent=msg;$('m').replaceChildren(h('a',{class:'btn',href:'/'},'Ir para a vitrine'))}
async function load(n=0){
  if(!ref)return fail('Link de pedido inválido.');
  try{
    const r=await fetch('/api/order/'+encodeURIComponent(ref)+(pid?'?payment_id='+encodeURIComponent(pid):''));
    if(!r.ok)return fail((await r.json().catch(()=>({}))).error||'Pedido não encontrado.');
    const o=await r.json();show(o);
    // o webhook pode demorar alguns segundos: continua consultando enquanto estiver pendente
    if(o.status==='pending'&&back!=='fail'&&n<10)setTimeout(()=>load(n+1),3000);
  }catch{fail('Não foi possível verificar o pedido agora. Atualize a página.')}
}
load();
</script></body></html>
