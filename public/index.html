<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCR iPhone</title><meta name="theme-color" content="#000000">
<!--OG--><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"></head>
<body>
<header><img class="logo" src="/logo.png" alt="NCR iPhone"><h1 id="title">NCR iPhone</h1><p class="sub" id="sub">Toque em um aparelho para ver fotos e parcelamento</p></header>
<main id="grid" class="grid"></main>
<footer>NCR iPhone</footer>
<div id="modal" class="modal" hidden></div>
<script>
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a)k==='class'?e.className=a[k]:e.setAttribute(k,a[k]);c.flat().forEach(x=>x!=null&&e.append(x.nodeType?x:document.createTextNode(x)));return e};
const modal=document.getElementById('modal');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
function closeM(){modal.hidden=true;modal.replaceChildren();document.body.style.overflow=''}
modal.onclick=e=>{if(e.target===modal)closeM()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function ph(i,name){const im=h('img',{src:i.url,alt:name,loading:'lazy'}),ok=()=>im.classList.add('ld');im.complete&&im.naturalWidth?ok():(im.onload=ok,im.onerror=ok);const d=h('div',{class:'ph'},im);d.style.setProperty('--bg',`url("${i.url}")`);return d}
const WA='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
function waBtn(p,phone){
  if(!phone)return null;
  const msg=`Olá! Tenho interesse no ${p.name}${p.price?` (${p.price})`:''}. Poderia me passar mais informações?`;
  const a=h('a',{class:'btn wa',target:'_blank',rel:'noopener',href:`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`},'Tenho interesse');
  a.insertAdjacentHTML('afterbegin',WA);return a;
}
function openM(p,phone){
  const imgs=p.images;let left;
  if(imgs.length){
    const sl=h('div',{class:'slides'},imgs.map(i=>ph(i,p.name)));left=h('div',{},sl);
    if(imgs.length>1){
      const th=h('div',{class:'thumbs2'},imgs.map((i,k)=>{const t=h('img',{src:i.url,alt:'',class:k?'':'on'});t.onclick=()=>sl.scrollTo({left:k*sl.clientWidth,behavior:'smooth'});return t}));
      sl.onscroll=()=>{const k=Math.round(sl.scrollLeft/sl.clientWidth);[...th.children].forEach((t,j)=>t.className=j===k?'on':'')};
      left.append(th);
    }
  }else left=h('div',{class:'noimg'},'📱');
  const pay=(p.installments||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const x=h('button',{class:'x','aria-label':'Fechar'},'×');x.onclick=closeM;
  const info=h('div',{class:'info'},h('h2',{},p.name),p.price?h('div',{class:'big'},p.price):null,
    p.description?h('p',{class:'desc full'},p.description):null,
    pay.length?h('div',{},h('h4',{},'💳 Parcelamento'),h('ul',{class:'pay'},pay.map(t=>h('li',{},t)))):null,
    waBtn(p,phone));
  modal.replaceChildren(h('div',{class:'sheet'},x,left,info));
  modal.hidden=false;document.body.style.overflow='hidden';
}
function card(p,phone){
  const gal=h('div',{class:'gal'},p.images[0]?ph(p.images[0],p.name):h('div',{class:'noimg'},'📱'));
  if(p.images.length>1)gal.append(h('span',{class:'more'},'📷 '+p.images.length));
  if(p.price)gal.append(h('span',{class:'price'},p.price));
  const c=h('article',{class:'card'},gal,h('div',{class:'body'},h('h2',{},p.name),h('p',{class:'desc'},p.description),h('span',{class:'det'},'Ver fotos e parcelamento ›'),waBtn(p,phone)));
  c.onclick=e=>{if(!e.target.closest('a'))openM(p,phone)};
  return c;
}
(async()=>{
  const slug=location.pathname.startsWith('/v/')?location.pathname.slice(3):'';
  const r=await fetch('/api/view'+(slug?'/'+slug:''));
  const g=document.getElementById('grid');
  if(!r.ok){g.replaceWith(h('p',{class:'empty'},'Link inválido ou removido.'));return}
  const v=await r.json();
  document.getElementById('title').textContent=document.title=v.title||'NCR iPhone';
  if(v.greeting)document.getElementById('sub').textContent=v.greeting;
  if(!v.products.length)g.replaceWith(h('p',{class:'empty'},'Nenhum produto disponível no momento.'));
  else v.products.forEach((p,i)=>{const c=card(p,v.whatsapp);c.classList.add('reveal');c.style.setProperty('--d',(i%6)*80+'ms');g.append(c);io.observe(c)});
})();
</script></body></html>
